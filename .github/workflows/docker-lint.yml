name: Check Docker image for vulnerabilities and functionality

on:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-lint.yml'
      - 'scripts/compare_scout_reports.py'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-lint.yml'
      - 'scripts/compare_scout_reports.py'

env:
  image_name: gilleshenrard/c-linters:test-build

jobs:
  build:
    name: Build, gate and smoke-test the image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          no-cache: true
          push: false
          load: true
          tags: ${{ env.image_name }}

      # Informational only: overview and base image recommendations in the job
      # summary. Never fails the job.
      - name: Report image overview (informational)
        uses: docker/scout-action@v1
        with:
          command: quickview,recommendations
          image: local://${{ env.image_name }}
          summary: true
          write-comment: false

      # The actual gate: fail if the image contains ANY fixable CVE, of any
      # severity, whether or not the published image already had it. Non-fixable
      # CVEs are ignored on purpose: nothing in this repository can resolve them.
      - name: Fail on any fixable CVE
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.image_name }}
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false

      - name: Test Clang tools
        run: |
          docker run --rm --entrypoint bash ${{ env.image_name }} -c "clang-tidy --version && clang-format --version"

      - name: Test CppCheck
        run: |
          docker run --rm ${{ env.image_name }} cppcheck --version

      - name: Test Doxygen
        run: |
          docker run --rm ${{ env.image_name }} doxygen --version

      - name: Test Lizard
        run: |
          docker run --rm ${{ env.image_name }} lizard --version

      - name: Test REUSE
        run: |
          docker run --rm ${{ env.image_name }} reuse --version
